[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "askari-vms"
version = "0.1.0"
description = "Local-first visitor, e-tag, and gate control system"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "opencv-python>=4.13,<6",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.22,<2",
    # Receipt printing sends RAW bytes to a Windows print queue. Imported lazily, so
    # the app still runs without it, but a gate PC always needs it.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
askari-vms-admin = "askari_vms.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
askari_vms = ["ui/assets/*.svg", "ui/assets/*.png", "ui/assets/*.jpeg", "ui/assets/*.jpg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
